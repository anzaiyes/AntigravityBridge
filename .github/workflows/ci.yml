name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Run tests
        run: ./tests/run-tests.sh
