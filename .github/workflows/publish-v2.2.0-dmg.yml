name: Attach v2.2.0 disk image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v2.2.0-dmg.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build disk image
        run: ./scripts/package.sh v2.2.0

      - name: Preserve existing ZIP and refresh checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download v2.2.0 \
            --pattern 'Antigravity-Bridge-v2.2.0-unsigned.zip' \
            --dir "$RUNNER_TEMP/release-assets"
          cp "$RUNNER_TEMP/release-assets/Antigravity-Bridge-v2.2.0-unsigned.zip" dist/
          cd dist
          shasum -a 256 \
            Antigravity-Bridge-v2.2.0-unsigned.zip \
            Antigravity-Bridge-v2.2.0-unsigned.dmg > SHA256SUMS

      - name: Upload disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v2.2.0 \
            dist/Antigravity-Bridge-v2.2.0-unsigned.dmg \
            dist/SHA256SUMS \
            --clobber
